<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>عسل السواكني | Elswakkny Honey</title>
<meta name="description" content="عسل السواكني: عسل برسيم وشمر وسدر وخلطات طبيعية، اطلب على واتساب وهنوصله لبيتك.">
<link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;800&display=swap" rel="stylesheet">
<style>
:root{--bg:#fff;--card:#fff;--gold:#e0a419;--gold2:#f7c948;--gt:#8f6300;--txt:#1c1710;--mut:#6f6652;--line:#e6dcc3;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);color-scheme:light}
*{box-sizing:border-box;margin:0}html{scroll-behavior:smooth;scroll-padding-top:120px}
body{background:var(--bg);color:var(--txt);font-family:'Cairo',Tahoma,sans-serif;max-width:1100px;margin:auto}
a{color:var(--gt)}
#ban{display:none;background:linear-gradient(90deg,var(--gold),var(--gold2));color:#1a1305;text-align:center;font-weight:800;padding:8px 12px;font-size:14px}
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:9;background:#fff;border-bottom:1px solid var(--line);padding:8px 12px 10px}
.tr{display:flex;align-items:center;justify-content:space-between}
.brand{display:flex;align-items:center;gap:8px;text-decoration:none;color:var(--gt);font-weight:800;font-size:18px}
.brand img{width:42px;height:42px;border-radius:8px;object-fit:cover}
.cartb{position:relative;background:none;border:0;font-size:28px;color:var(--txt);cursor:pointer;padding:4px 8px}
.cartb i{position:absolute;top:-2px;left:-2px;min-width:20px;height:20px;border-radius:10px;background:var(--gold);color:#1a1305;font:800 12px 'Cairo',sans-serif;display:none;align-items:center;justify-content:center;font-style:normal}
.sr{display:flex;margin-top:8px}
.sr input{border:1px solid var(--gold)!important;flex:1;border:0;border-radius:0 10px 10px 0;padding:11px 14px;font:16px 'Cairo',sans-serif;background:#fff;color:#111;outline:0}
.sr button{border:0;background:linear-gradient(135deg,var(--gold2),var(--gold));border-radius:10px 0 0 10px;padding:0 16px;font-size:18px}
.nav{display:flex;gap:6px;overflow-x:auto;padding:8px 12px;background:#faf6ec;border-bottom:1px solid var(--line);align-items:center;white-space:nowrap}
.nav a{color:var(--txt);text-decoration:none;font-size:14px;padding:5px 12px;border-radius:16px}
.nav a:hover{background:#f3ead2}
.nav select{margin-right:auto;background:#fff;color:var(--txt);border:1px solid var(--line);border-radius:8px;padding:5px;font:14px 'Cairo',sans-serif}
.hero{margin:12px;border-radius:18px;padding:26px 18px;text-align:center;background:linear-gradient(180deg,#fff1c4,#fffdf6);border:1px solid #ecd9a0}
.hero img{width:min(190px,50vw);border-radius:14px}
.hero h1{font-size:24px;color:var(--gt);margin-top:10px}.hero p{color:var(--mut);margin:4px 0 14px}
.btn,.btn2{display:block;width:100%;border:0;border-radius:22px;font:800 15px 'Cairo',sans-serif;padding:10px 14px;cursor:pointer;text-decoration:none;text-align:center}
.btn{background:linear-gradient(135deg,var(--gold2),var(--gold));color:#1a1305}
.btn2{background:#fff8e1;color:var(--gt);border:1px solid var(--gold);margin-top:7px}
.hero .btn{display:inline-block;width:auto;padding:11px 30px}
.trust{display:grid;grid-template-columns:repeat(2,1fr);gap:8px;margin:0 12px}
.trust div{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:10px;text-align:center;font-size:13px;color:var(--gt)}
.trust b{display:block;font-size:22px}
h2{font-size:22px;margin:22px 14px 10px;color:var(--txt);border-right:4px solid var(--gold);padding-right:10px}h2 small{color:var(--mut);font-size:14px}
.grid{display:grid;gap:10px;padding:0 12px;grid-template-columns:repeat(2,1fr)}
@media(min-width:700px){.grid{grid-template-columns:repeat(4,1fr)}.trust{grid-template-columns:repeat(4,1fr)}}
.card{box-shadow:0 1px 5px #0000001a;background:var(--card);border:1px solid var(--line);border-radius:14px;overflow:hidden;display:flex;flex-direction:column}
.im{aspect-ratio:1;background:radial-gradient(circle,#ffeab0,#f6d77a);display:flex;align-items:center;justify-content:center;font-size:56px}
.im img{width:100%;height:100%;object-fit:cover}
.bd{padding:10px;display:flex;flex-direction:column;flex:1}
.bd h3{font-size:16px;line-height:1.4}
.tg{color:#1f8a43;font-size:12px;margin:2px 0}
.d{color:var(--mut);font-size:12px;line-height:1.5;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;min-height:36px}
.w{display:flex;gap:5px;margin:8px 0;flex-wrap:wrap}
.w button{flex:1;background:none;border:1px solid var(--line);color:var(--txt);border-radius:8px;padding:5px 2px;font:600 12px 'Cairo',sans-serif;cursor:pointer;white-space:nowrap}
.w button.on{border-color:var(--gold);color:var(--gt);background:#fff4d1}
.price{margin:auto 0 8px;font-size:14px;color:var(--gt)}.price b{font-size:26px;color:var(--txt)}
.off{text-align:center;color:var(--mut);padding:10px}.no{grid-column:1/-1;text-align:center;color:var(--mut);padding:30px}
footer{text-align:center;color:var(--mut);padding:30px 14px;margin-top:24px;background:#fff;border-top:1px solid var(--line);font-size:14px;line-height:1.9}
footer b{color:var(--gt);font-size:18px}
#drawer,#pm{position:fixed;inset:0;background:#000c;display:none;z-index:30;align-items:flex-end}
#pm{z-index:25}#drawer.open,#pm.open{display:flex}
.im{position:relative}.hb{position:absolute;top:8px;left:8px;width:34px;height:34px;border-radius:50%;border:0;background:#fffc;color:#c0392b;font-size:20px;cursor:pointer}
.chips{display:flex;gap:6px;overflow-x:auto;padding:0 12px 10px}.chips button{border:1px solid var(--line);background:var(--card);color:var(--txt);border-radius:18px;padding:6px 16px;font:600 14px 'Cairo',sans-serif;white-space:nowrap;cursor:pointer}.chips button.on{border-color:var(--gold);background:#fff4d1;color:var(--gt)}
.rvr{display:flex;gap:10px;overflow-x:auto;padding:0 12px}.rc{min-width:110px;background:var(--card);border:1px solid var(--line);border-radius:12px;overflow:hidden;text-align:center;cursor:pointer;font-size:13px}.rc span,.rc img{display:flex;height:80px;width:100%;object-fit:cover;align-items:center;justify-content:center;font-size:32px;background:#fbe9ae}.rc b{display:block;padding:6px}
.faq{margin-top:14px}.faq details{border-top:1px solid var(--line);padding:10px 0;font-size:14px;color:var(--mut)}.faq summary{color:var(--txt);font-weight:700;cursor:pointer}
.sheet{background:var(--card);width:100%;max-height:90%;overflow:auto;border-radius:20px 20px 0 0;padding:18px 16px calc(18px + env(safe-area-inset-bottom,0px));max-width:600px;margin:auto}
.sheet h2{margin:0 0 8px}
.it{display:flex;justify-content:space-between;align-items:center;padding:10px 0;border-bottom:1px solid var(--line);gap:8px}
.it b{display:block}.it small{color:var(--mut)}
.q{display:flex;align-items:center;gap:8px}
.q button{width:30px;height:30px;border-radius:50%;border:1px solid var(--gold);background:none;color:var(--gt);font-size:18px;cursor:pointer}
.sheet input,.sheet textarea,#dbody input,#dbody textarea{width:100%;background:#fff;border:1px solid var(--line);color:var(--txt);border-radius:10px;padding:10px;font:16px 'Cairo',sans-serif;margin-top:8px}
.tot{display:flex;justify-content:space-between;font-size:20px;font-weight:800;margin:12px 0;color:var(--gt)}
.x{float:left;background:none;border:0;color:var(--mut);font-size:26px;cursor:pointer}
#dash{position:fixed;inset:0;background:var(--bg);z-index:40;display:none;flex-direction:column}
#dash.open{display:flex}
.dh{display:flex;justify-content:space-between;align-items:center;padding:calc(12px + env(safe-area-inset-top,0px)) 16px 12px;border-bottom:1px solid var(--line);color:var(--gt);font-size:20px}
#dbody{flex:1;overflow:auto;padding:4px 16px 20px;max-width:640px;width:100%;margin:auto}
#dbody h3{color:var(--gt);margin:18px 0 4px}
#dbody label{display:block;color:var(--mut);font-size:13px;margin-top:8px}
.pb{border:1px solid var(--line);border-radius:12px;padding:6px 12px 12px;margin:10px 0}
.dr{display:flex;gap:8px;align-items:flex-end}.dr label{flex:1}
.ck{display:flex!important;align-items:center;gap:8px}.ck input{width:auto!important;margin:0!important}
.rm{background:none;border:1px solid #7a2e2e;color:#e07a7a;border-radius:8px;padding:6px 10px;margin-top:8px;font:600 13px 'Cairo',sans-serif;cursor:pointer}
.sm{background:none;border:1px dashed var(--gold);color:var(--gt);border-radius:10px;padding:8px 14px;margin-top:8px;font:600 14px 'Cairo',sans-serif;cursor:pointer}
.df{padding:12px 16px calc(12px + env(safe-area-inset-bottom,0px));border-top:1px solid var(--line)}
.ir{display:flex;gap:8px;align-items:center;flex-wrap:wrap;margin-top:8px}
.th{width:64px;height:64px;object-fit:cover;border-radius:10px;border:1px solid var(--line)}
</style>
</head>

 document.getElementById('grid').innerHTML=L.length?L.map(card).join(''):'<p class="no">مفيش نتائج للبحث</p>'}
function card(i){var x=P[i];return '<div class="card"><div class="im" onclick="show('+i+')"><button class="hb" onclick="event.stopPropagation();fav('+i+')" aria-label="مفضلة">'+(wish.indexOf(x.n)>-1?'♥':'♡')+'</button>'+(x.img?'<img src="/_blob/'+x.img+'" alt="'+esc(x.n)+'" loading="lazy">':'<span>🍯</span>')+'</div><div class="bd"><h3 onclick="show('+i+')" style="cursor:pointer">'+esc(x.n)+'</h3><div class="tg">✔ طبيعي 100%</div><p class="d">'+esc(x.d)+'</p><div class="w">'+
 (x.p>0?W:[]).map(function(w,j){return '<button class="'+(sel[i]==j?'on':'')+'" onclick="pick('+i+','+j+')">'+esc(w.l)+'</button>'}).join('')+
 '</div>'+(x.p>0?'<div class="price"><b>'+num(x.p*W[sel[i]].k)+'</b> ج</div>':'<div class="price" style="font-size:15px">السعر على واتساب</div>')+
 (x.off?'<div class="off">غير متاح حاليًا</div>':x.p<=0?'<a class="btn" target="_blank" rel="noopener" href="'+waLink('عايز أعرف سعر '+x.n+' والأوزان المتاحة')+'">اسأل عن السعر</a>':'<button class="btn" onclick="add('+i+')">أضف للسلة</button><button class="btn2" onclick="add('+i+');openCart()">اشتري الآن</button>')+'</div></div>'}

function pick(i,j){sel[i]=j;render();if(cur===i)show(i,1)}
function lsGet(k,d){try{return JSON.parse(localStorage.getItem(k))||d}catch(e){return d}}
function lsSet(k,v){try{localStorage.setItem(k,JSON.stringify(v))}catch(e){}}
function chips(){document.getElementById('chips').innerHTML=[['all','الكل'],['honey','عسل'],['mix','خلطات'],['fav','♥ المفضلة']].map(function(c){return '<button class="'+(cat==c[0]?'on':'')+'" onclick="cat=\''+c[0]+'\';render()">'+c[1]+'</button>'}).join('')}
function fav(i){var n=P[i].n,k=wish.indexOf(n);if(k>-1)wish.splice(k,1);else wish.push(n);lsSet('wl',wish);render();if(cur===i)show(i,1)}
function rvw(){var L=recent.map(function(n){return P.findIndex(function(x){return x.n===n})}).filter(function(i){return i>-1});
 document.getElementById('rv').innerHTML=L.length?'<h2>شاهدتها مؤخرًا</h2><div class="rvr">'+L.map(function(i){var x=P[i];return '<div class="rc" onclick="show('+i+')">'+(x.img?'<img src="/_blob/'+x.img+'" alt="">':'<span>🍯</span>')+'<b>'+esc(x.n)+'</b></div>'}).join('')+'</div>':''}
function show(i,k){cur=i;var x=P[i];
 if(!k){recent=[x.n].concat(recent.filter(function(n){return n!==x.n})).slice(0,8);lsSet('rv',recent);rvw()}
 var h='<button class="x" onclick="hide()">×</button><div class="im" style="aspect-ratio:4/3;border-radius:14px;margin-top:6px">'+(x.img?'<img src="/_blob/'+x.img+'" alt="'+esc(x.n)+'">':'<span>🍯</span>')+'</div><h2 style="margin:12px 0 4px;border:0;padding:0">'+esc(x.n)+'</h2><div class="tg">✔ طبيعي 100%</div><p style="color:var(--mut);margin:6px 0 10px">'+esc(x.d)+'</p>';
 if(x.off)h+='<div class="off">غير متاح حاليًا</div>';
 else if(x.p>0)h+='<div class="w">'+W.map(function(w,j){return '<button class="'+(sel[i]==j?'on':'')+'" onclick="pick('+i+','+j+')">'+esc(w.l)+'</button>'}).join('')+'</div><div class="price"><b>'+num(x.p*W[sel[i]].k)+'</b> ج</div><button class="btn" onclick="add('+i+');hide()">أضف للسلة</button><button class="btn2" onclick="add('+i+');hide();openCart()">اشتري الآن</button>';
 else h+='<a class="btn" target="_blank" rel="noopener" href="'+waLink('عايز أعرف سعر '+x.n+' والأوزان المتاحة')+'">اسأل عن السعر</a>';
 h+='<div class="faq"><details><summary>إزاي أطلب؟</summary>أضف المنتج للسلة واضغط إتمام الطلب، وهيفتح واتساب برسالة جاهزة بطلبك.</details><details><summary>إزاي أحفظ العسل؟</summary>في برطمان مقفول بعيد عن الحرارة والرطوبة.</details><details><summary>عن التوصيل والدفع</summary>كلمنا على واتساب ونتفق على التفاصيل.</details></div>';
 document.getElementById('pmb').innerHTML=h;document.getElementById('pm').classList.add('open')}
function hide(){cur=-1;document.getElementById('pm').classList.remove('open')}
function ld(){try{var o={"@context":"https://schema.org","@type":"ItemList","itemListElement":P.filter(function(x){return x.p>0&&!x.off}).map(function(x,i){return{"@type":"ListItem","position":i+1,"item":{"@type":"Product","name":x.n,"description":x.d,"brand":{"@type":"Brand","name":D.name},"offers":{"@type":"Offer","priceCurrency":"EGP","price":String(x.p),"availability":"https://schema.org/InStock"}}}})};var e=document.createElement('script');e.type='application/ld+json';e.textContent=JSON.stringify(o).replace(/</g,'\\u003c');document.head.appendChild(e)}catch(e){}}
function add(i){var k=i+'_'+sel[i];cart[k]=(cart[k]||0)+1;upd()}
function chg(k,d){cart[k]+=d;if(cart[k]<=0)delete cart[k];upd()}
function info(k){var a=k.split('_'),x=P[a[0]],w=W[a[1]];return{n:x.n,w:w.l,p:x.p*w.k}}
function upd(){
 var c=0,t=0,h='';
 Object.keys(cart).forEach(function(k){var o=info(k),q=cart[k];c+=q;t+=o.p*q;
  h+='<div class="it"><div><b>'+esc(o.n)+'</b><small>'+esc(o.w)+' — '+f(o.p)+'</small></div><div class="q"><button onclick="chg(\''+k+'\',1)">+</button><span>'+q+'</span><button onclick="chg(\''+k+'\',-1)">−</button></div></div>'});
 document.getElementById('items').innerHTML=h||'<p style="color:var(--mut)">السلة فاضية</p>';
 document.getElementById('tot').textContent=f(t);
 var cc=document.getElementById('cc');cc.textContent=c;cc.style.display=c?'flex':'none';
 lsSet('cart',cart);wl();if(!c)closeCart()}
function openCart(){document.getElementById('drawer').classList.add('open')}
function closeCart(){document.getElementById('drawer').classList.remove('open')}
function msg(){
 var ks=Object.keys(cart);if(!ks.length)return '';
 var m='طلب جديد من موقع '+D.name+' 🍯\n',t=0;
 ks.forEach(function(k){var o=info(k),q=cart[k];t+=o.p*q;m+='• '+o.n+' ('+o.w+') × '+q+' = '+f(o.p*q)+'\n'});
 m+='\nالإجمالي: '+f(t);
 var n=document.getElementById('nm').value,a=document.getElementById('ad').value;
 if(n)m+='\nالاسم: '+n;if(a)m+='\nالعنوان: '+a;
 return m}
function waLink(m){return 'https://wa.me/'+wa()+'?text='+encodeURIComponent(m)}
function wl(){var a=document.getElementById('wal');if(a)a.href=waLink(msg()||('أهلاً '+D.name))}
function cp(){var m=msg();if(!m)return;try{navigator.clipboard.writeText(m).then(function(){alert('تم نسخ الطلب')},function(){prompt('انسخ الطلب:',m)})}catch(e){prompt('انسخ الطلب:',m)}}
head();render();upd();
</script>
</body>
</html>
